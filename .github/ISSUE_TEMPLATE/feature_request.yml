name: Feature request
description: Propose a change or new capability
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying need rather than a specific implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints acknowledged
      options:
        - label: This proposal does not require runtime reflection on a supported code path
        - label: This proposal remains compatible with Native AOT and trimming
        - label: I am willing to help implement this