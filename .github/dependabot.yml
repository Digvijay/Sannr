# Dependabot version updates. Security updates run without this file, but
# version updates do not: every ecosystem the repository actually ships must
# be listed here or it is silently unwatched.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Sannr.Gen is a Roslyn compiler extension. The Microsoft.CodeAnalysis
      # compiler packages declare the *minimum* Roslyn a consumer must have,
      # so a generator built against 5.x stops loading in the 4.x compilers
      # that ship with the .NET 8 SDK and VS 2022. Hold the major deliberately
      # and raise it only when dropping those toolchains is intended.
      # Microsoft.CodeAnalysis.Analyzers is dev-time only and stays current.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
